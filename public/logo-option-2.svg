<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="leftLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="rightLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="centerNexus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#4F46E5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="50" y="50" width="400" height="400" rx="90" fill="url(#bgGrad2)"/>
  <rect x="50" y="50" width="400" height="400" rx="90" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3"/>

  <!-- Infinity Handshake Geometry -->
  <g filter="url(#glow2)">
    <!-- Credit Loop (Udhar - Left Wing) -->
    <path d="M 250 250 
             C 180 160, 110 180, 110 250 
             C 110 320, 180 340, 250 250" 
          fill="none" 
          stroke="url(#leftLoop)" 
          stroke-width="36" 
          stroke-linecap="round"/>

    <!-- Settlement Loop (Jama - Right Wing) -->
    <path d="M 250 250 
             C 320 340, 390 320, 390 250 
             C 390 180, 320 160, 250 250" 
          fill="none" 
          stroke="url(#rightLoop)" 
          stroke-width="36" 
          stroke-linecap="round"/>

    <!-- Interlocking Center Handshake Knot -->
    <circle cx="250" cy="250" r="28" fill="url(#centerNexus)"/>
    <circle cx="250" cy="250" r="14" fill="#FFFFFF"/>
  </g>
</svg>
