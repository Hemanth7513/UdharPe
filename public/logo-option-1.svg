<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="primaryGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="50" y="50" width="400" height="400" rx="100" fill="url(#bgGrad1)"/>
  
  <!-- Subtle Decorative Border -->
  <rect x="50" y="50" width="400" height="400" rx="100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Golden / Rupee Node Geometry -->
  <g filter="url(#shadow1)" transform="translate(130, 110)">
    <!-- Top Horizontal Rupee Bar 1 -->
    <rect x="20" y="30" width="200" height="28" rx="14" fill="url(#primaryGrad1)"/>
    
    <!-- Top Horizontal Rupee Bar 2 -->
    <rect x="20" y="75" width="165" height="26" rx="13" fill="url(#primaryGrad1)"/>

    <!-- 'U' Loop & Rupee Spine -->
    <path d="M 50 30 
             L 50 170 
             C 50 240, 190 240, 190 170 
             L 190 110" 
          fill="none" 
          stroke="url(#primaryGrad1)" 
          stroke-width="28" 
          stroke-linecap="round"/>

    <!-- Forward Slanted Dynamic Settlement Kick -->
    <path d="M 105 175 
             L 195 265" 
          stroke="url(#accentGrad1)" 
          stroke-width="28" 
          stroke-linecap="round"/>
  </g>

  <!-- Glowing Verification Point -->
  <circle cx="345" cy="390" r="14" fill="#10B981"/>
  <circle cx="345" cy="390" r="26" fill="none" stroke="#10B981" stroke-width="3" opacity="0.4"/>
</svg>
