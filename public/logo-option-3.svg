<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="ledgerCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="rupeeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect x="50" y="50" width="400" height="400" rx="95" fill="url(#bgGrad3)"/>
  <rect x="50" y="50" width="400" height="400" rx="95" fill="none" stroke="#CBD5E1" stroke-width="2"/>

  <!-- 3D Bahi-Khata Book / Shield -->
  <g filter="url(#shadow3)">
    <!-- Back Spine Layer -->
    <path d="M 130 140 
             C 130 120, 150 110, 170 110 
             L 330 110 
             C 350 110, 360 125, 360 145 
             L 360 350 
             C 360 375, 340 390, 315 390 
             L 165 390 
             C 140 390, 130 375, 130 350 Z" 
          fill="url(#ledgerCover)"/>

    <!-- Bookmark Ribbon in Imperial Gold -->
    <path d="M 290 110 L 290 220 L 310 195 L 330 220 L 330 110 Z" fill="url(#badgeGold)"/>

    <!-- Precision Laser-Cut Rupee Seal -->
    <g transform="translate(170, 175)">
      <!-- Top Bar 1 -->
      <rect x="15" y="10" width="105" height="18" rx="9" fill="url(#rupeeCyan)"/>
      <!-- Top Bar 2 -->
      <rect x="15" y="42" width="85" height="16" rx="8" fill="url(#rupeeCyan)"/>
      <!-- Curved Loop -->
      <path d="M 30 10 
               L 30 100 
               C 30 140, 105 140, 105 100 
               C 105 70, 30 70, 30 70" 
            fill="none" 
            stroke="url(#rupeeCyan)" 
            stroke-width="18" 
            stroke-linecap="round"/>
      <!-- Diagonal Leg -->
      <path d="M 65 105 L 115 160" 
            stroke="url(#rupeeCyan)" 
            stroke-width="18" 
            stroke-linecap="round"/>
    </g>
  </g>
</svg>
